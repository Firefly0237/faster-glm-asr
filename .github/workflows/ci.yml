name: CPU checks

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements/ci.in
            pyproject.toml

      - name: Install CPU check tools and package
        run: |
          python -m pip install --disable-pip-version-check torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -r requirements/ci.in
          python -m pip install --disable-pip-version-check --no-build-isolation -e .
          python -m pip check

      - name: Compile source
        run: python -m compileall -q src experiments tests tools

      - name: Lint
        run: python -m ruff check .

      - name: Test CPU and contract paths
        run: python -m pytest -q

      - name: Build source and wheel distributions
        if: matrix.python-version == '3.11'
        run: python -m build --no-isolation
